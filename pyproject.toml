[project]
name = "argos"
version = "0.1.0"
description = "A simple, free personal assistant."
authors = [
    { name = "samuelferoli", email = "298381065+samuelferoli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
argos = "argos.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
